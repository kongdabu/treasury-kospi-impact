# 미국채 선물 → 국내 증시 영향분석 보고서를 GitHub Pages로 배포
name: Deploy Report to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 (진행 중 배포는 취소하지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v6

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: 아티팩트 업로드 (docs 폴더만 발행)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
